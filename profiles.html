<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfiles</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4 fw-bold text-primary">Perfiles Registrados</h2>

    <div class="row" id="profilesContainer"></div>

    <hr class="my-5">
    <h3 class="text-center mb-3">Crear nuevo perfil</h3>

    <form id="createProfileForm" class="card p-4 shadow-sm">
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control" name="full_name" placeholder="Nombre completo" required>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" name="profession" placeholder="Profesión" required>
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" name="city" placeholder="Ciudad">
        </div>
        <div class="col-md-6">
          <input type="text" class="form-control" name="phone" placeholder="Teléfono">
        </div>
        <div class="col-12">
          <textarea class="form-control" name="bio" placeholder="Descripción o experiencia"></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-4 w-100">Guardar Perfil</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/profiles.js"></script>
</body>
</html>
