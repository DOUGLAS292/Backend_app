<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ofertas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5">
    <h2 class="text-center mb-4 text-success fw-bold">Ofertas disponibles</h2>
    <div class="row" id="offersContainer"></div>

    <hr class="my-5">
    <h3 class="text-center mb-3">Publicar nueva oferta</h3>

    <form id="createOfferForm" class="card p-4 shadow-sm">
      <div class="row g-3">
        <div class="col-md-6">
          <input type="text" class="form-control" name="title" placeholder="Título" required>
        </div>
        <div class="col-md-6">
          <input type="number" class="form-control" name="budget_cop" placeholder="Presupuesto (COP)">
        </div>
        <div class="col-12">
          <textarea class="form-control" name="description" placeholder="Descripción de la oferta"></textarea>
        </div>
        <div class="col-12">
          <input type="text" class="form-control" name="client_id" placeholder="ID del cliente" required>
        </div>
      </div>
      <button type="submit" class="btn btn-success mt-4 w-100">Publicar oferta</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/offers.js"></script>
</body>
</html>
